bedrock:
  # Claude Haiku 4.5 cross-region inference — prefix matches region (us./eu./ap.)
  # Override with AWS_DEFAULT_REGION env var or the --region flag
  default_model: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  region: eu-central-1
  profile: null
  temperature: 0.5
  max_tokens: 1024
  request_timeout: 60
  max_retries: 3

recommender:
  default_n_factors: 20
  default_n_epochs: 20
  default_cf_method: matrix_factorization
  default_rl_strategy: thompson_sampling
  default_n_recommendations: 10
  cf_weight: 0.6
